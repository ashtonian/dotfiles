[storage]
engine = file_system
path = .sync
# sync.sh uses mackup/<LocalHostName> (scutil, with hostname -s as fallback).
# This unpartitioned default is used for manual Mackup commands.
directory = mackup

[applications_to_ignore]
# === Managed by stow (would conflict) ===
git
zsh
ssh
gnupg

# === Contains credentials/secrets ===
aws
docker

# === Have their own cloud sync ===
1password
bear
day-one
todoist
notion
obsidian
spotify
slack
discord
dropbox
google-chrome
firefox
brave
signal
telegram
whatsapp
zoom
microsoft-teams
vscode
