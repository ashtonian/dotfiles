id = "brew.desktop"
description = "Personal desktop applications and peripherals: games, media, messaging, VPN, cloud accounts and the headset"
category = "packages"
platforms = ["darwin"]
requires = ["brew.base"]

[provides]
# HeadsetControl's own tap: homebrew-core has no headsetcontrol formula.
tap = ["sapd/headsetcontrol"]
# Battery, sidetone, lights, idle shutdown and equalizer for the SteelSeries Arctis Nova Pro Wireless,
# without SteelSeries GG.
brew = ["sapd/headsetcontrol/headsetcontrol"]
cask = [
  "battle-net",
  "discord",
  "element",
  "maestral",
  "nordvpn",
  "signal",
  "spotify",
  "steam",
  "tor-browser",
  "vox",
]
