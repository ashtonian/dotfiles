# Shared ssh settings (feature ssh), linked to ~/.ssh/dotfiles.conf and
# included by the local ~/.ssh/config stub. ssh keeps the first value it finds
# for each option, so the machine's own settings come first: ~/.ssh/config.local,
# the enabled features' fragments, and anything installers append to
# ~/.ssh/config after the stub's Include. The defaults below come last: `Match
# final` applies them in ssh's final pass, to whatever is still unset.
IgnoreUnknown UseKeychain

# OrbStack's 'orb' host, where OrbStack is installed; it must come before any
# Host block. A missing file is ignored.
Include ~/.orbstack/ssh/config

Include config.local
Include ~/.config/dotfiles/generated/ssh_config

# Default settings for all hosts
Match final
    AddKeysToAgent yes
    UseKeychain yes
    IdentityFile ~/.ssh/id_ed25519
    StrictHostKeyChecking accept-new
    IdentitiesOnly yes
    HashKnownHosts yes
    ControlMaster auto
    ControlPath ~/.ssh/control-%C
    ControlPersist 600
