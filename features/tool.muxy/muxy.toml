# Muxy settings every machine shares, set one key at a time through the app's
# own `muxy config set`. The rest of Muxy's settings.toml and terminal.toml
# (recent projects, remote servers, layouts) stays this machine's own.
# `muxy config list` shows every key; quote dotted keys. `dotfiles adopt
# muxy:<key>` keeps a value changed in Muxy.
"appearance.agent_sessions_visible" = true
"appearance.dark_theme" = "Dracula"
"appearance.light_theme" = "Dracula"
"appearance.tips_visible" = false
"composer.font_family" = "FiraCode Nerd Font"
# The Mono variant keeps Nerd Font icons one cell wide, as terminal programs expect.
"terminal.font_families" = ["FiraCode Nerd Font Mono"]
"terminal.font_size" = 14.0
# Settings > Terminal > Selection > Copy on select. clipboard.copy_on_select is
# only where Muxy imports a 1.x setting; the terminal does not read it.
"terminal.options.copy_on_select" = true
