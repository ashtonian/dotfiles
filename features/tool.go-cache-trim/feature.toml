id = "tool.go-cache-trim"
description = "Hourly: keeps each Go build cache under 400 GiB, entries unused for 24 hours first, then least recently used (bin/go-cache-trim)"
category = "tools"
platforms = ["darwin"]

[[provides.launch_agent]]
plist = "launchagents/com.ashtonian.go-cache-trim.plist"
# Homebrew's go, which the job's PATH finds (brew.base).
when_exists = ["/opt/homebrew/bin/go"]
