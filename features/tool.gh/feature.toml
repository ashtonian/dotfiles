id = "tool.gh"
description = "GitHub CLI settings (a managed copy: gh rewrites it) and gh as git's GitHub credential helper"
category = "tools"
requires = ["git"]

# Where the stow package used to link these files.
retire = [
  ".config/gh/config.yml",
]

[provides]
copy = [".config/gh/config.yml"]
gitconfig = "gitconfig"
