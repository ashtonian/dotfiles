id = "agents.agent-monitor"
description = "The loopback agent dashboard and its token-checked LAN gate (bin/agent-monitor, docs/AGENT-MONITOR.md)"
category = "agents"
platforms = ["darwin"]

# Each waits for the step that sets it up: `agent-monitor install` for the
# dashboard, `agent-monitor lan enable` for the gate.
[[provides.launch_agent]]
plist = "launchagents/com.ashtonian.agent-monitor.plist"
when_exists = ["~/.local/share/agent-monitor/app/server/index.js"]

[[provides.launch_agent]]
plist = "launchagents/com.ashtonian.agent-monitor-gate.plist"
when_exists = ["~/.local/share/agent-monitor/config/gate-token"]
