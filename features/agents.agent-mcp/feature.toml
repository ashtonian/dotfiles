id = "agents.agent-mcp"
description = "The agent-mcp launcher, its Serena context, and the MCP credential helpers in ~/.claude/mcp (docs/AGENT-MCP.md)"
category = "agents"
platforms = ["darwin", "linux"]

# Where the stow package used to link these files.
retire = [
  ".config/agent-mcp/serena-claude-code.yml",
  ".local/bin/agent-mcp",
]

[provides]
brew = ["gh", "github-mcp-server"]
# ~/.claude/mcp also holds the pinned server installs, which stay untracked;
# only the credential helpers are linked into it, one file each.
link = [".config/agent-mcp", ".local/bin/agent-mcp", ".claude/mcp"]
