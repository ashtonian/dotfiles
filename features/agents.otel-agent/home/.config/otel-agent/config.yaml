# Local OpenTelemetry Collector for this Mac's coding agents (bin/otel-agent,
# docs/AGENT-TELEMETRY.md). Claude Code, Codex and OpenCode export OTLP to
# 127.0.0.1; this collector deletes identities and tool content, then forwards
# metrics and log events to the cluster gateway with this host's bearer token.
#
# Nothing site-specific lives here: bin/otel-agent serve reads the gateway URL,
# token and host name from ~/.local/share/otel-agent and passes them, with the
# queue directory, as environment variables. The redaction patterns must match
# the cluster gateway's config (k8s/monitoring/otel-gateway), which
# repeats them in case a client skips this collector.
extensions:
  health_check:
    endpoint: 127.0.0.1:13134

  # The export queues live on disk, so telemetry recorded offline or during a
  # gateway outage survives restarts and is sent once the gateway answers. One
  # bbolt file per exporter. A file holds about 1.3 times its queue's bytes;
  # max_size is the backstop above the largest queue. Rebound compaction gives
  # the space back once a backlog has drained; recreate starts a fresh file
  # when one is corrupt (bin/otel-agent keeps only the newest .backup).
  file_storage/queue:
    directory: ${env:OTEL_AGENT_QUEUE}
    create_directory: true
    directory_permissions: "0700"
    max_size: 3221225472 # 3 GiB per file
    fsync: true
    recreate: true
    compaction:
      directory: ${env:OTEL_AGENT_QUEUE}
      on_start: true
      on_rebound: true
      rebound_needed_threshold_mib: 100
      rebound_trigger_threshold_mib: 10
      cleanup_on_start: true

receivers:
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: coding-agent-collector
          scrape_interval: 60s
          static_configs:
            - targets: ["127.0.0.1:8889"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'otelcol_(exporter_(queue_(size|capacity)|(enqueue_failed|send_failed)_(log_records|metric_points))|receiver_(accepted|refused)_(log_records|metric_points))'
              action: keep
            # Count agent traffic at the OTLP receiver, excluding this scrape.
            - source_labels: [receiver]
              regex: 'prometheus/collector'
              action: drop
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
      grpc:
        endpoint: 127.0.0.1:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50

  # Identity: Claude Code always attaches user.email and the account and
  # organization IDs; Codex attaches user.email and user.account_id to every log
  # event. Content: prompts, responses, tool arguments and output (Codex logs a
  # preview of every tool's output), full error text and raw API bodies can carry
  # source code or secrets. Names, sizes, durations, outcomes and token counts
  # stay. `[.]` matches a literal dot without backslash escaping.
  resource/redact:
    attributes:
      - pattern: &identity_keys '^(user[.](email|id|account_id|account_uuid|groups)|organization[.]id)$'
        action: delete
  attributes/redact:
    actions:
      - pattern: *identity_keys
        action: delete
      - pattern: '^(prompt|prompt_text|response|tool_input|tool_parameters|arguments|output|error|error[.]message|auth[.]error|body|body_ref|diff|hook_definitions|redacted_settings)$'
        action: delete

  # The source name enrolled with this host's token (studio, mbp, mini). The
  # gateway indexes Loki streams and Mimir series by it.
  resource/host:
    attributes:
      - key: host.name
        value: ${env:OTEL_AGENT_HOST}
        action: upsert

  batch:
    timeout: 5s

# One exporter per signal, and one for hardware metrics, so each queue is sized
# for its own volume and a backlog in one never starves another. Queues are
# measured in serialized bytes and sized for a week off the LAN at studio's
# rate: log events are about 860 bytes each (~80 MB/day), agent metric points
# about 480 bytes (~270 MB/day), hardware metric points about 84 bytes (~290 a
# minute, ~35 MB/day). Loki and Mimir refuse data more than a week old, which
# bounds a lossless outage whatever the queue holds. When a queue is full, new
# data is dropped and counted in otelcol_exporter_enqueue_failed_*.
exporters:
  otlp_http/logs: &gateway
    endpoint: ${env:OTEL_AGENT_GATEWAY}
    headers:
      Authorization: Bearer ${env:OTEL_AGENT_TOKEN}
    compression: gzip
    # Retry until delivered: the bound is the queue, not time. Backing off to
    # 5 minutes keeps a laptop that is off the LAN from retrying every 30 s.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 5m
      max_elapsed_time: 0
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: 805306368 # 768 MiB, about 9 days
  otlp_http/metrics:
    <<: *gateway
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: 2147483648 # 2 GiB, about 8 days
  # Hardware metrics, for the conf.d pipeline macos.host-metrics adds; never
  # started on a Mac without it.
  otlp_http/host:
    <<: *gateway
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: 335544320 # 320 MiB, about 9.5 days

service:
  extensions: [health_check, file_storage/queue]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8889
  pipelines:
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [memory_limiter, resource/redact, attributes/redact, resource/host, batch]
      exporters: [otlp_http/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/redact, attributes/redact, resource/host, batch]
      exporters: [otlp_http/logs]
