id = "agents.otel-agent"
description = "OpenTelemetry Collector config for agent telemetry (docs/AGENT-TELEMETRY.md)"
category = "agents"
platforms = ["darwin"]

# Where the stow package used to link these files.
retire = [
  ".config/otel-agent/config.yaml",
]

[provides]
link = [".config/otel-agent"]

# The collector waits for enrollment (bin/otel-agent enroll), which writes the
# host file last.
[[provides.launch_agent]]
plist = "launchagents/com.ashtonian.otel-agent.plist"
when_exists = [
  "~/.local/share/otel-agent/endpoint",
  "~/.local/share/otel-agent/token",
  "~/.local/share/otel-agent/host",
]

# Turning the feature off removes the enrollment `bin/otel-agent enroll` made.
[hooks]
teardown = "hooks/teardown"
