[storage]
engine = file_system
path = .sync
# Sync no longer runs Mackup (settings backup returns with rollout step 8);
# this unpartitioned default is used for manual Mackup commands.
directory = mackup

[applications_to_ignore]
# === Managed by the dotfiles feature engine (would conflict) ===
git
zsh
ssh
gnupg

# === Contains credentials/secrets ===
aws
docker

# === Have their own cloud sync ===
1password
bear
day-one
todoist
notion
obsidian
spotify
slack
discord
dropbox
google-chrome
firefox
brave
signal
telegram
whatsapp
zoom
microsoft-teams
vscode
