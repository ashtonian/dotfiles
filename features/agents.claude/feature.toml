id = "agents.claude"
description = "Claude Code: the global instructions, the claudemore and claudemax launchers, the status line and claude-subagent-economics"
category = "agents"
# The launchers append its delegation policy; its subagents serve their sessions.
requires = ["agents.delegation"]

# Where the stow package used to link these files.
retire = [
  ".claude/CLAUDE.md",
]

[provides]
link = [
  ".claude/CLAUDE.md",
  # settings.json's statusLine runs it.
  ".claude/statusline-p10k.sh",
]
bin = ["bin/claude-subagent-economics"]
zshrc = "zshrc.zsh" # claudemore, claudemax
