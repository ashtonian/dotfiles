id = "macos.spotlight"
description = "Spotlight privacy exclusions for toolchains, package stores and app caches (docs/SPOTLIGHT.md)"
category = "macos"
platforms = ["darwin"]

[provides]
link = [".config/spotlight", ".local/bin/spotlight-exclusions"]

# Turning the feature off leaves the folders excluded: putting a toolchain
# back in the index only costs a reindex.
[hooks]
apply = "hooks/apply"

[check]
script = "hooks/check"
