id = "tool.gitstead"
description = "gitstead, its shared settings (a managed copy) and its scheduled sync every 15 minutes under the host gate lock"
category = "tools"
platforms = ["darwin"]
requires = ["brew.base"]

[provides]
cask = ["ashtonian/tap/gitstead"]
# A managed copy, not a link: `gitstead setup` and `clone --save` edit the
# config file, and a link would publish their edits here.
copy = [".config/gitstead/config.yaml"]

[[provides.launch_agent]]
plist = "launchagents/com.ashtonian.gitstead.plist"
# The job runs gitstead through the gate lock's shim, which the lock's own
# install.sh puts on PATH; a Mac without the lock waits rather than syncing ungated.
when_exists = ["/opt/homebrew/bin/gitstead", "~/.local/bin/gate-lock"]
