# Every machine.

[features]
enable = [
  "shell.env",
  "shell.zsh",
  "git",
  "git.keychain",
  "ssh",
  "tool.gh",
  "tool.atuin",
  "tool.htop",
  "tool.colorls",
  "tool.mise",
  "brew.base",
  "brew.macos",
  "macos.spotlight",
  # The LaunchAgents every Mac runs: this repository's sync and weekly update,
  # disk pruning, the Go cache trim, and gpg-agent for signing over SSH.
  "dotfiles.sync",
  "dotfiles.update",
  "macos.disk-hygiene",
  "tool.go-cache-trim",
  "tool.gpg-agent",
]

[settings]
# The one machine that trials and publishes the shared mise pins.
"mise.canary" = "studio"
