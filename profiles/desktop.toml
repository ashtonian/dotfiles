# Machines someone sits at.

[features]
enable = [
  "brew.apps",
  "brew.desktop",
  "brew.activity-trackers",
  "brew.mas",
  "brew.mas.personal",
  "backup.mackup.config",
  # Passkey prompts from sites, browsers and 1Password (docs/PASSKEYS.md).
  "browser.passkeys-off",
  # The G502 X PLUS's G5 button opens Mission Control (docs/KARABINER.md).
  "tool.karabiner",
  # Muxy and its terminal font, the Muxy settings every Mac shares, and the
  # other Macs as Muxy servers (docs/MUXY.md).
  "tool.muxy",
  # They reach the home cluster: OpenCode's homelab gateway, and the
  # collector that forwards agent telemetry to it (D1, D31).
  "agents.opencode",
  "agents.otel-agent",
]
