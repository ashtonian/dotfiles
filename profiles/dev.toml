# Development machines.

[features]
enable = [
  "brew.dev-apps",
  "brew.vscode",
  "brew.go-tools",
  "agents.claude",
  # Blocks Claude Code and Codex writes to the repositories the overlays protect.
  "agents.repo-guard",
  "agents.agent-mcp",
  # The Codex app-server, and the agent dashboard once agent-monitor install ran.
  "agents.codex",
  "agents.agent-monitor",
]
