name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    # Pull requests from forks run nothing: CI here is for this repository's
    # own branches. A maintainer runs an outside change by pushing it to a
    # branch here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  shell:
    # Pull requests from forks run nothing: CI here is for this repository's
    # own branches. A maintainer runs an outside change by pushing it to a
    # branch here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: shell and sync (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # RealFeatures builds the engine and applies the repository's features.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: python3 -B -m unittest discover -s tests -v
